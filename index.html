<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="container">

        <header id="headerContainer">
            <h1>Student Directory</h1>
            <p>Manage your students in one place</p>
        </header>

        <section id="formContainer">
            <h2>Add New Student</h2>

            <form id="studentForm">
                <div class="form-grid">
                    <div class="input-field">
                        <label for="name">Student Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter student name" required>
                    </div>

                    <div class="input-field">
                        <label for="program">Program</label>
                        <input type="text" id="program" name="program" placeholder="Enter program" required>
                    </div>
                </div>

                <button type="submit" class="add-button">
                    + Add Student
                </button>
            </form>
        </section>

        <section id="listSection">
            <div class="list-header">
                <h2>Student List</h2>
                <span id="studentCount">0 Students</span>
            </div>

            <div id="listContainer" class="student-grid"></div>

            <p id="emptyMessage">
                No students yet. Add your first student!
            </p>
        </section>

        <footer>Student Directory &copy; 2026</footer>

    </main>
</body>

</html>
